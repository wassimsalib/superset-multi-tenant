[pytest]
# Pytest configuration for multi-tenant tests
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for selective test running
markers =
    postgres: Tests that require PostgreSQL
    security: Security-critical tests
    rls: Tests for Row-Level Security
    slow: Slow-running tests

# Default options
addopts = -v --tb=short

# Logging
log_cli = true
log_cli_level = WARNING
