# Multi-tenant nginx configuration
# Routes *.app.localhost to Superset, preserving Host header for tenant detection

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent [$connection_requests] "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" host=$host';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  30;
    keepalive_requests 2;

    # Compression
    gzip on;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_proxied       any;
    gzip_vary          on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    output_buffers 20 10m;
    client_max_body_size 10m;

    # Upstream for Superset app
    upstream superset_app {
        server superset:8088;
        keepalive 100;
    }

    # Upstream for Superset websocket
    upstream superset_websocket {
        server superset-websocket:8080;
        keepalive 100;
    }

    # Upstream for frontend dev server (static assets)
    upstream superset_node {
        server superset-node:9000;
        keepalive 100;
    }

    # Multi-tenant server block
    # Handles *.app.localhost subdomains
    server {
        listen 80 default_server;
        server_name  ~^(?<tenant>.+)\.app\.localhost$ app.localhost localhost;

        # WebSocket endpoint
        location /ws {
            proxy_pass http://superset_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Static assets from dev server
        location /static {
            proxy_pass http://superset_node;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # All other requests to Superset app
        # IMPORTANT: Preserve Host header for tenant detection
        location / {
            proxy_pass http://superset_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 80;
            proxy_set_header X-Tenant $tenant;
            proxy_http_version 1.1;
            port_in_redirect off;
            proxy_connect_timeout 300;
        }
    }
}
