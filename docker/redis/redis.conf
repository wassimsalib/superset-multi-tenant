# Redis configuration for multi-tenant Superset
# Enables ACL persistence for tenant isolation

# Persist ACLs to file (required for ACL SAVE to work)
aclfile /data/users.acl

# Enable AOF persistence for data durability
appendonly yes

# Bind to all interfaces (docker networking)
bind 0.0.0.0

# Disable protected mode (container-only access)
protected-mode no
