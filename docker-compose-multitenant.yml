#
# Multi-Tenant Apache Superset with Keycloak + Warehouse
#
# This is a STANDALONE docker-compose for the multi-tenant demo.
# It includes everything needed: Superset, Keycloak, and a demo data warehouse.
#
# Usage:
#   docker compose -f docker-compose-multitenant.yml up -d
#   ./docker/scripts/demo-bootstrap.sh
#
# Access:
#   Demo Tenant:  http://demo.app.localhost (demo-admin/demo123)
#   Acme Tenant:  http://acme.app.localhost (acme-admin/acme123)
#   Keycloak:     http://localhost:8180 (admin/admin)
#
# Prerequisites:
#   Add to /etc/hosts:
#     127.0.0.1 demo.app.localhost acme.app.localhost host.docker.internal
#
# Based on upstream Apache Superset docker-compose.yml
# Licensed under Apache License 2.0
#

x-superset-user: &superset-user root
x-superset-volumes: &superset-volumes
  - ./docker:/app/docker
  - ./superset:/app/superset
  - ./superset-core:/app/superset-core
  - ./superset-frontend:/app/superset-frontend
  - superset_home:/app/superset_home
  - ./tests:/app/tests
  - superset_data:/app/data
x-common-build: &common-build
  context: .
  target: ${SUPERSET_BUILD_TARGET:-dev}
  cache_from:
    - apache/superset-cache:3.10-slim-trixie
  args:
    DEV_MODE: "true"
    INCLUDE_CHROMIUM: ${INCLUDE_CHROMIUM:-false}
    INCLUDE_FIREFOX: ${INCLUDE_FIREFOX:-false}
    BUILD_TRANSLATIONS: ${BUILD_TRANSLATIONS:-false}

services:
  # ==========================================================================
  # MULTI-TENANT SERVICES
  # ==========================================================================

  # Keycloak Identity Provider (one realm per tenant)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: superset_keycloak
    command: start-dev
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # DEV ONLY: Change this password in production deployments
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Demo Data Warehouse (per-tenant schemas)
  warehouse:
    image: postgres:15
    container_name: superset_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse_admin
      # DEV ONLY: Change this password in production deployments
      POSTGRES_PASSWORD: warehouse_secret
      POSTGRES_DB: datawarehouse
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-5433}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./docker/warehouse-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_admin -d datawarehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # SUPERSET CORE SERVICES (with multi-tenant config)
  # ==========================================================================

  # Nginx reverse proxy (multi-tenant subdomain routing)
  nginx:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Use multi-tenant nginx config for subdomain routing
      - ./docker/nginx/templates/superset-multitenant.conf.template:/etc/nginx/templates/superset.conf.template:ro
    depends_on:
      - superset
      - keycloak

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data

  # Superset metadata database
  db:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  # Main Superset application
  superset:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    build:
      <<: *common-build
    command: ["/app/docker/docker-bootstrap.sh", "app"]
    restart: unless-stopped
    ports:
      - ${SUPERSET_PORT:-8088}:8088
      - ${CYPRESS_PORT:-8081}:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: *superset-user
    depends_on:
      superset-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    volumes: *superset-volumes
    environment:
      # Multi-tenant configuration (can also be set in docker/.env)
      MULTI_TENANT_ENABLED: "true"
      KEYCLOAK_BASE_URL: http://host.docker.internal:8180
      MULTI_TENANT_BASE_DOMAIN: app.localhost

  superset-websocket:
    build: ./superset-websocket
    ports:
      - ${WEBSOCKET_PORT:-8080}:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - ./superset-websocket:/home/superset-websocket
      - /home/superset-websocket/node_modules
      - /home/superset-websocket/dist
      - ./docker/superset-websocket/config.example.json:/home/superset-websocket/config.json:ro
    environment:
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false

  # Superset initialization (runs migrations, creates admin)
  superset-init:
    build:
      <<: *common-build
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    environment:
      # Use superuser for migrations (required to create tables, RLS policies)
      # The app will use non-superuser (DATABASE_APP_USER) for RLS enforcement
      DATABASE_APP_USER: superset
      DATABASE_APP_PASSWORD: superset
      # Skip default examples - we have our own tenant data
      SUPERSET_LOAD_EXAMPLES: "no"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: *superset-user
    volumes: *superset-volumes
    healthcheck:
      disable: true

  superset-node:
    build:
      context: .
      target: superset-node
      args:
        DEV_MODE: "true"
        BUILD_TRANSLATIONS: ${BUILD_TRANSLATIONS:-false}
    environment:
      BUILD_SUPERSET_FRONTEND_IN_DOCKER: true
      NPM_RUN_PRUNE: false
      SCARF_ANALYTICS: "${SCARF_ANALYTICS:-}"
      superset: "http://superset:8088"
      WEBPACK_DEVSERVER_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:${NODE_PORT:-9000}:9000"
    command: ["/app/docker/docker-frontend.sh"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    volumes: *superset-volumes

  superset-worker:
    build:
      <<: *common-build
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    environment:
      CELERYD_CONCURRENCY: 2
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: *superset-user
    volumes: *superset-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]

  superset-worker-beat:
    build:
      <<: *common-build
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    restart: unless-stopped
    depends_on:
      - superset-worker
    user: *superset-user
    volumes: *superset-volumes
    healthcheck:
      disable: true

  superset-tests-worker:
    build:
      <<: *common-build
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    profiles:
      - optional
    environment:
      DATABASE_HOST: localhost
      DATABASE_DB: test
      REDIS_CELERY_DB: 2
      REDIS_RESULTS_DB: 3
      REDIS_HOST: localhost
      CELERYD_CONCURRENCY: 8
    network_mode: host
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: *superset-user
    volumes: *superset-volumes
    healthcheck:
      test: ["CMD-SHELL", "celery inspect ping -A superset.tasks.celery_app:app -d celery@$$HOSTNAME"]

volumes:
  superset_home:
    external: false
  db_home:
    external: false
  redis:
    external: false
  superset_data:
    external: false
  keycloak_data:
    external: false
  warehouse_data:
    external: false
